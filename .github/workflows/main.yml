name: Dev-Builds
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: azul/zulu-openjdk-alpine:17-latest
    steps:
      - uses: actions/checkout@v2.3.4
      - run: chmod +x ./gradlew
      - run: ./gradlew clean build jar
      - uses: actions/upload-artifact@v4
        with:
          name: Builds
          path: build/libs/*.jar
